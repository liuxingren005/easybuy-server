# server
server:
  port: 8080
  # 监听所有网络接口
  address: 0.0.0.0
  # servlet encoding
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  # 激活开发环境
  profiles:
    active: dev
  # spring datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/easybuy?useSSL=false&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # spring jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # spring redis
  data:
    redis:
      host: 192.168.222.4
      port: 6379
      password: 123456
      database: 0
  # 文件上传
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # elasticsearch
  elasticsearch:
    uris: http://192.168.222.4:9200
    username: es
    password: 123456
  # Spring Mail 邮箱服务（注册/找回密码/修改密码 验证码）
  # 开发环境可使用 QQ 邮箱
  mail:
    host: smtp.qq.com # QQ 邮箱：host=smtp.qq.com port=465
    port: 465
    username: 3996175938@qq.com # username=xxx@qq.com
    password: mutowisapwdhccih    # QQ 邮箱使用"授权码"
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

# mybatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.maven.entity
  configuration:
    map-underscore-to-camel-case: true

# pagehelper
pagehelper:
  reasonable: true
  support-methods-arguments: true

# SFTP 文件服务器
sftp:
  host: 192.168.222.4
  port: 22
  username: sftpuser
  password: 123456
  #private-key: ~/.ssh/id_rsa
  remote-root: /uploads/easybuy

# logging
logging:
  level:
    org.maven: debug
#    org.mybatis: debug

# SpringDoc OpenAPI(Swagger)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# JWT + Redis 会话跟踪
jwt:
  # HS256 密钥（至少 256 位 - 32 字节）
  secret: easybuy-jwt-secret-key-0123456789-abcdef
  # 令牌有效期
  expire: 3600
  # 请求头名称
  header: Authorization
  # 令牌 JWT ← Basic xxx（账密）、Digest xxx、Bearer xxx（JWT）
  prefix: "Bearer "

# 权限校验（白名单）
auth:
  # 全方法白名单
  # /user/login、/user/register、/user/sendEmailCode
  # /doc.html                                        Knife4j
  # /swagger-ui.html、/swagger-ui/**、/v3/api-docs/**  Swagger
  # /webjars/**                                      js/css
  # /favicon.ico 浏览器 -> Nginx (前端服务器) -> Spring Boot (后端服务器)
  white-list-all: [ /user/login, /user/register, /user/sendEmailCode, /doc.html, /swagger-ui.html, /v3/api-docs/**, /swagger-ui/**, /webjars/**, /favicon.ico, /alipay/notify, /alipay/return, /wechat/notify ]
  # GET只读白名单
  # /product/**             商品相关查询
  # /productCategory/**     商品分类查询
  # /news/list              新闻列表
  # /news/{id:\d+}          新闻详情
  white-list-get: [ /product/**, /productCategory/**, /news/list, "/news/{id:\\d+}" ] # YAML

# 支付宝
alipay:
  app-id: 9021000167621589          # 沙箱/正式应用APPID 9021000167621589
  app-private-key:    # 应用私钥（PKCS8格式）
  alipay-public-key:           # 支付宝公钥
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do  # 沙箱网关；正式环境用 https://openapi.alipay.com/gateway.do
  sign-type: RSA2
  charset: UTF-8
  format: json
  notify-url: http://107.174.137.2/alipay/notify   # 支付异步回调地址（公网访问）
  return-url: http://107.174.137.2/alipay/return  # 支付同步跳转地址（前端页面）

# 微信
wechat:
  pay:
    appid: wxa738052168ff7dc8           # 微信AppID（公众号/小程序/移动应用）
    mch-id: 1606612310             # 商户号
    api-v3-key: hnjyet993603562456bdqn4685030352  # APIv3密钥（32位）
    private-key-path: classpath:wechat/apiclient_key.pem  # 商户API私钥文件路径
    merchant-serial-number: 328B40F3A627A7E88A714FF5CA8027BE767EF3F2  # 商户API证书序列号
    notify-url: http://107.174.137.2/wechat/notify   # 微信支付异步回调地址（开发环境用 http；生产：https + 域名 + 可信证书）

# 邮箱验证码（Redis 存储）
email:
